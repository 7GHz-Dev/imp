<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice → NETBAY CSV</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --ink: #1d2330; --muted: #667085; --line: #e3e6ec;
    --brand: #1f6feb; --brand-ink: #fff; --ok: #1a7f37; --ok-bg: #e7f6ec;
    --warn: #9a6700; --warn-bg: #fff6dd; --err: #c62828; --err-bg: #fdecec; --new: #e8f0fe;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --ink: #e6e9ef; --muted: #98a2b3; --line: #2c3340;
      --brand: #4c8dff; --ok: #4ac26b; --ok-bg: #16301f; --warn: #e3b341; --warn-bg: #33290f;
      --err: #ff7b72; --err-bg: #3a1a1a; --new: #1c2b45;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 "Segoe UI", Tahoma, "Noto Sans Thai", sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 24px;
           display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  header h1 { font-size: 18px; margin: 0; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font-size: 13px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .chip.ok { color: var(--ok); border-color: currentColor; }
  .chip.bad { color: var(--warn); border-color: currentColor; }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
  .steps { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .step { flex: 1 1 180px; padding: 10px 14px; border-radius: 10px; background: var(--card);
          border: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  .step b { display: inline-block; width: 22px; height: 22px; border-radius: 50%; text-align: center;
            line-height: 22px; margin-right: 6px; background: var(--line); color: var(--ink); font-size: 13px; }
  .step.active { border-color: var(--brand); color: var(--ink); }
  .step.active b { background: var(--brand); color: var(--brand-ink); }
  .step.done b { background: var(--ok); color: #fff; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
  .card h2 { font-size: 16px; margin: 0 0 12px; }
  .drop { display: block; border: 2px dashed var(--line); border-radius: 12px; padding: 34px 16px; text-align: center; cursor: pointer;
          color: var(--muted); transition: border-color .15s, background .15s; }
  .drop.over, .drop:hover { border-color: var(--brand); background: var(--new); color: var(--ink); }
  .drop strong { color: var(--ink); font-size: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kv { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .kv span { display: block; font-size: 12px; color: var(--muted); }
  .kv div { font-weight: 600; word-break: break-all; }
  .msg { border-radius: 10px; padding: 10px 14px; margin: 10px 0; font-size: 14px; }
  .msg ul { margin: 6px 0 0; padding-left: 20px; }
  .msg.err { background: var(--err-bg); color: var(--err); }
  .msg.warn { background: var(--warn-bg); color: var(--warn); }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  details summary { cursor: pointer; font-weight: 600; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { background: var(--bg); font-weight: 600; color: var(--muted); font-size: 13px; }
  tr:last-child td { border-bottom: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.engine { font-family: Consolas, monospace; }
  td.engine.fresh { background: var(--new); font-weight: 600; }
  .tag { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
  .tag.new { color: var(--brand); border-color: currentColor; }
  .tag.reuse, .tag.keep { color: var(--muted); }
  .bad-tariff { color: var(--warn); font-weight: 600; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  button, .btn { font: inherit; border-radius: 8px; padding: 9px 16px; border: 1px solid var(--line);
                 background: var(--card); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-block; }
  button.primary, .btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .log { background: #0d1117; color: #c9d1d9; border-radius: 10px; padding: 12px; font: 13px/1.6 Consolas, monospace;
         max-height: 260px; overflow: auto; white-space: pre-wrap; margin-top: 12px; }
  .muted { color: var(--muted); font-size: 13px; }
  .hidden { display: none; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent;
             border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>Invoice → CSV สำหรับ NETBAY</h1>
  <div class="chips" id="chips"></div>
</header>

<main>
  <div class="steps">
    <div class="step active" id="st1"><b>1</b>อัปโหลด invoice</div>
    <div class="step" id="st2"><b>2</b>ตรวจข้อมูล</div>
    <div class="step" id="st3"><b>3</b>สุ่มเลขเครื่อง + สร้าง CSV</div>
    <div class="step" id="st4"><b>4</b>ส่งเข้า NETBAY</div>
  </div>

  <section class="card" id="uploadCard">
    <h2>1. อัปโหลดไฟล์ invoice (Excel)</h2>
    <label class="drop" id="drop">
      <input type="file" id="file" accept=".xlsx,.xlsm" hidden>
      <strong>ลากไฟล์มาวาง หรือคลิกเพื่อเลือกไฟล์</strong><br>
      รองรับ template MSFZ, JTC, AICHI, HUAYO, JAN TRADING (.xlsx)
    </label>
    <div id="uploadMsg"></div>
  </section>

  <section class="card hidden" id="previewCard">
    <h2 id="previewTitle">2. ตรวจข้อมูล</h2>
    <div class="grid" id="summary"></div>
    <div id="messages"></div>
    <div class="table-wrap"><table id="cars"></table></div>
    <div class="actions" id="previewActions">
      <button class="primary" id="commitBtn">สุ่มเลขเครื่องและสร้าง CSV</button>
      <button id="resetBtn">เลือกไฟล์ใหม่</button>
      <span class="muted" id="commitNote"></span>
    </div>
    <div class="actions hidden" id="resultActions">
      <a class="btn primary" id="dlCsv">ดาวน์โหลด CSV</a>
      <a class="btn" id="dlExcel">ดาวน์โหลด Excel (เติมเลขเครื่องแล้ว)</a>
      <button id="netbayBtn">ส่งเข้า NETBAY</button>
      <button id="resetBtn2">ทำไฟล์ถัดไป</button>
    </div>
    <div class="log hidden" id="netbayLog"></div>
  </section>

  <section class="card">
    <h2>ประวัติล่าสุด</h2>
    <div class="table-wrap"><table id="runs"></table></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let token = null, currentRun = null, status = {}, lastName = '';

function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e[k] = v; else e.setAttribute(k, v);
  }
  for (const c of children.flat()) e.append(c instanceof Node ? c : document.createTextNode(c ?? ''));
  return e;
}
const fmt = n => (n === '' || n == null) ? '' : Number(n).toLocaleString('en-US', {maximumFractionDigits: 2});

function setStep(n) {
  for (let i = 1; i <= 4; i++) {
    $('st' + i).className = 'step' + (i < n ? ' done' : i === n ? ' active' : '');
  }
}

function msgBox(kind, title, items) {
  if (!items || !items.length) return '';
  const list = el('ul', {}, items.map(t => el('li', {}, t)));
  if (kind === 'warn' && items.length > 4) {
    return el('div', {class: 'msg warn'}, el('details', {}, el('summary', {}, `${title} (${items.length})`), list));
  }
  return el('div', {class: 'msg ' + kind}, el('strong', {}, title), list);
}

async function loadStatus() {
  status = await (await fetch('/api/status')).json();
  $('chips').replaceChildren(
    el('span', {class: 'chip ok'}, `ฐานข้อมูลเลขเครื่อง ${status.db_count.toLocaleString()} เลข`),
    el('span', {class: 'chip ' + (status.excel ? 'ok' : 'bad')}, status.excel ? 'Microsoft Excel พร้อม' : 'ไม่มี Excel (ใช้ openpyxl)'),
    el('span', {class: 'chip ' + (status.netbay_ready ? 'ok' : 'bad')}, status.netbay_ready ? 'NETBAY ตั้งค่าแล้ว' : 'NETBAY ยังไม่ตั้งรหัสผ่าน'),
  );
  renderRuns(status.runs);
}

function renderRuns(runs) {
  const head = el('tr', {}, ['เวลา', 'BL', 'Invoice', 'ชนิด', 'จำนวนรถ', 'ไฟล์', ''].map(h => el('th', {}, h)));
  const rows = runs.map(r => el('tr', {},
    el('td', {}, r.created), el('td', {}, r.bl_no), el('td', {}, r.invoice_no), el('td', {}, r.file_type),
    el('td', {class: 'num'}, String(r.cars.length)),
    el('td', {}, el('a', {href: `/download/${r.run_id}/csv`}, 'CSV'), ' · ', el('a', {href: `/download/${r.run_id}/excel`}, 'Excel')),
    el('td', {}, el('button', {onclick: () => sendNetbay(r)}, 'ส่ง NETBAY')),
  ));
  $('runs').replaceChildren(el('thead', {}, head),
    el('tbody', {}, rows.length ? rows : el('tr', {}, el('td', {colspan: 7, class: 'muted'}, 'ยังไม่มีรายการ'))));
}

function renderSummary(d, cars) {
  const newCount = cars.filter(c => c.status === 'new').length;
  $('summary').replaceChildren(...[
    ['ชนิดไฟล์', d.file_type], ['เลข Invoice', d.invoice_no], ['วันที่', d.invoice_date],
    ['เลข BL', d.bl_no], ['จำนวนรถ', cars.length + ' คัน'], ['สุ่มเลขใหม่', newCount + ' เลข'],
  ].map(([k, v]) => el('div', {class: 'kv'}, el('span', {}, k), el('div', {}, v || '-'))));
}

function renderCars(cars, committed) {
  const head = el('tr', {}, ['#', 'ยี่ห้อ / รุ่น', 'Chassis', 'ปี', 'CC', 'เชื้อเพลิง', 'น้ำหนัก', 'ราคา', 'พิกัด',
    'เลขเครื่องเดิม', committed ? 'เลขเครื่อง' : 'เลขเครื่องที่จะได้', ''].map(h => el('th', {}, h)));
  const body = cars.map(c => el('tr', {},
    el('td', {class: 'num'}, String(c.car_no)), el('td', {}, `${c.brand} ${c.model}`), el('td', {}, c.chassis),
    el('td', {}, c.year), el('td', {class: 'num'}, fmt(c.cc)), el('td', {}, c.fuel),
    el('td', {class: 'num'}, fmt(c.weight)), el('td', {class: 'num'}, fmt(c.price)),
    el('td', {class: c.tariff.includes('X') ? 'bad-tariff' : ''}, c.tariff),
    el('td', {class: 'engine'}, c.engine_before), el('td', {class: 'engine' + (c.status === 'new' ? ' fresh' : '')}, c.engine),
    el('td', {}, el('span', {class: 'tag ' + c.status}, c.status_text)),
  ));
  $('cars').replaceChildren(el('thead', {}, head), el('tbody', {}, body));
  $('cars').parentElement.classList.toggle('hidden', !cars.length);
}

function showAnalysis(d) {
  $('previewCard').classList.remove('hidden');
  $('previewTitle').textContent = '2. ตรวจข้อมูล — ' + (d.filename || lastName);
  renderSummary(d, d.cars || []);
  $('messages').replaceChildren(
    msgBox('err', 'ต้องแก้ไฟล์ก่อน', d.errors), msgBox('warn', 'ข้อควรตรวจ', d.warnings));
  renderCars(d.cars || [], false);
  $('previewActions').classList.remove('hidden');
  $('resultActions').classList.add('hidden');
  $('netbayLog').classList.add('hidden');
  $('commitBtn').disabled = !d.ok;
  $('commitNote').textContent = d.ok ? `จะสุ่มเลขใหม่ ${d.new_count} เลข และบันทึกลงฐานข้อมูล` : 'แก้ไฟล์ตามรายการสีแดงแล้วอัปโหลดใหม่';
  setStep(d.ok ? 3 : 2);
}

async function upload(file) {
  lastName = file.name;
  $('uploadMsg').replaceChildren(el('div', {class: 'msg'}, el('span', {class: 'spinner'}), 'กำลังอ่านไฟล์ ', file.name));
  const fd = new FormData(); fd.append('file', file);
  const res = await fetch('/api/analyze', {method: 'POST', body: fd});
  const d = await res.json();
  $('uploadMsg').replaceChildren();
  if (!d.token) { $('uploadMsg').replaceChildren(msgBox('err', 'อัปโหลดไม่สำเร็จ', d.errors)); return; }
  token = d.token; currentRun = null;
  showAnalysis(d);
}

async function commit() {
  $('commitBtn').disabled = true;
  $('commitNote').replaceChildren(el('span', {class: 'spinner'}), 'กำลังสุ่มเลขและสร้างไฟล์ ...');
  const res = await fetch('/api/commit', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({token})});
  const d = await res.json();
  if (!d.ok) { showAnalysis({cars: [], ...d}); return; }
  const run = d.run; currentRun = run;
  renderSummary(run, run.cars);
  renderCars(run.cars, true);
  $('messages').replaceChildren(
    el('div', {class: 'msg ok'}, el('strong', {}, 'สร้าง CSV สำเร็จ'),
      ` — สุ่มเลขเครื่อง ${run.cars.filter(c => c.status === 'new').length} เลข บันทึกลงฐานข้อมูลแล้ว`),
    msgBox('warn', 'ข้อควรตรวจ', run.warnings));
  $('previewActions').classList.add('hidden');
  $('resultActions').classList.remove('hidden');
  $('dlCsv').href = `/download/${run.run_id}/csv`;
  $('dlExcel').href = `/download/${run.run_id}/excel`;
  $('netbayBtn').disabled = !status.netbay_ready;
  $('netbayBtn').title = status.netbay_ready ? '' : 'ใส่ username/password ของ NETBAY ใน config.ini ก่อน';
  setStep(4);
  loadStatus();
}

async function sendNetbay(run) {
  if (!status.netbay_ready) { alert('ใส่ username/password ของ NETBAY ใน config.ini ก่อน'); return; }
  if (!confirm(`ส่ง BL ${run.bl_no} (${run.cars.length} คัน) เข้า NETBAY?\nจะเปิดหน้าต่าง Chrome ขึ้นมากรอกให้ — ตรวจแล้วกด Save เอง`)) return;
  const res = await fetch('/api/netbay', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({run_id: run.run_id})});
  const d = await res.json();
  const log = $('netbayLog');
  if ($('previewCard').classList.contains('hidden')) $('previewCard').classList.remove('hidden');
  log.classList.remove('hidden');
  if (!d.ok) { log.textContent = d.error; return; }
  log.textContent = 'เริ่มส่ง BL ' + run.bl_no + ' ...';
  const poll = async () => {
    const j = await (await fetch('/api/netbay/' + d.job_id)).json();
    log.textContent = j.log.join('\n');
    log.scrollTop = log.scrollHeight;
    if (j.status === 'running') setTimeout(poll, 1000);
  };
  poll();
}

function reset() {
  token = null; currentRun = null;
  $('previewCard').classList.add('hidden');
  $('file').value = '';
  setStep(1);
  window.scrollTo({top: 0, behavior: 'smooth'});
}

const drop = $('drop');
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); });
$('file').addEventListener('change', e => { if (e.target.files[0]) upload(e.target.files[0]); });
$('commitBtn').onclick = commit;
$('resetBtn').onclick = reset;
$('resetBtn2').onclick = reset;
$('netbayBtn').onclick = () => currentRun && sendNetbay(currentRun);
loadStatus();
</script>
</body>
</html>
