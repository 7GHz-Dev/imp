; คัดลอกไฟล์นี้เป็น config.ini แล้วใส่รหัสผ่านจริง  (config.ini ไม่ถูกเก็บใน git)

[database]
; SQLite เก็บเลขเครื่องที่ออกไปแล้ว  สร้าง/นำเข้าข้อมูลเดิมด้วย setup.bat
path = data/engine.db

[paths]
output_dir = output
work_dir = work
; ค่าคงที่ของ CSV (610, MAESOT FREE ZONE, FX_permitNo1 ...) แก้ที่แถว 3 ของไฟล์นี้
csv_template = data/csv_template.xlsx
; ยี่ห้อรถที่ไม่ได้ผลิตในญี่ปุ่น -> originCountry
brand_country = data/brand_country.xlsx
; ใช้เมื่อไฟล์ invoice ไม่มีชีต datatariff
tariff_file = data/DATA TARIFF.xlsx

[csv]
encoding = tis-620

[excel]
; auto = ใช้ Microsoft Excel ถ้ามี (แนะนำ) ไม่มีก็ใช้ openpyxl | excel | openpyxl
method = auto

[web]
host = 127.0.0.1
port = 5000

[netbay]
url = http://192.168.1.123/kola/spn
username =
password =
declaration_type = 610
importer_search = MAESOT FREE ZONE
importer_name = บริษัท เเม่สอด ฟรีโซน จำกัด
vessel = OOCL BANGKOK
voyage = XXXX
origin_country = JP
; ช่องแถว 9 ด้านขวาของหัวใบขน — ค่าเดิมจากโปรแกรมเก่า
release_port = 2836
; no = เปิดหน้าต่างเบราว์เซอร์ให้เห็นและตรวจก่อนกด Save เอง
headless = no

[erp]
; worker.py รับงาน "สร้าง Draft" จาก ERP-KOLA (PAINT > งานคงค้าง > 3. Draft ใบขน)
url = https://erp-kola.vercel.app
; WORKER_API_KEY ตัวเดียวกับที่ตั้งไว้บน Vercel
api_key =
; ว่าง = imp@<ชื่อเครื่อง>
worker_name =
; ถามคิวทุกกี่วินาที (ERP ถือว่า worker ออฟไลน์ถ้าเงียบเกิน 70 วินาที)
poll_seconds = 20
